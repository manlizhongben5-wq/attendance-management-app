<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>教科追加</title>

  <!-- 参照CSS -->
  <link rel="stylesheet" href="../../assets/css/style.css" />

  <!-- 認証JS -->
  <script src="../../assets/js/common/auth.js" defer></script>
  <script src="../../assets/js/common/login.js" defer></script> 

  <!-- ページ固有JS -->
  <script src="../../assets/js/pages/admin-subject-add.js" defer></script>

</head>
<body class="role-admin page-admin_subject-add">

  <!--ヘッダー -->
  <header class="app-header">

    <!-- 左の戻る矢印 -->
    <a href="admin_subject-management.html">
      <button class="back-btn" type="button" aria-label="戻る">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M14.5 5.5L8 12l6.5 6.5"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </a>

    <h1 class="app-title">出欠管理システム</h1>

    <!-- 右側エリア -->
    <div class="header-right">
      <div id="login-name" class="login-name">ログイン名</div>
      <button id="logout-btn" class="logout-btn" type="button">ログアウト</button>
    </div>
  </header>

  <!-- メイン -->
  <main class="page">
    <div class="page-top">
      <h2 class="page-title">教科追加
</h2>
    </div>

 <section class="content">
      <form class="password-change-form" action="#" method="post">

        <!-- 追加する教科名入力 -->
        <div class="field">
          <label for="number" class="field-label">
            追加する教科名<span class="req">*</span>
          </label>
          <input id="number" name="number" type="text" class="text-input" />
        </div>

         <!-- 名前入力 -->
        <div class="field">
          <label for="name" class="field-label">総コマ数</label>
          <input id="name" name="name" type="text" class="text-input" />
        </div>

        <!-- 登録ボタン -->
        <div class="actions">
          <button type="submit" class="submit-btn">登録</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
