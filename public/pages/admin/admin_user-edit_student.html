<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ユーザー追加(学生)</title>

  <!-- 参照CSS -->
  <link rel="stylesheet" href="../../assets/css/style.css" />

   <!-- 認証JS -->
  <script src="../../assets/js/common/auth.js" defer></script>
  <script src="../../assets/js/common/login.js" defer></script> 

    <!-- ページ固有JS -->
  <script src="../../assets\js\pages\admin-user-edit_students.js" defer></script>

</head>
<body class="role-admin page-admin_user-edit_teacher">

  <!--ヘッダー -->
  <header class="app-header">

    <!-- 左の戻る矢印 -->
    <a href="admin_user-management.html">
      <button class="back-btn" type="button" aria-label="戻る">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M14.5 5.5L8 12l6.5 6.5"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </a>

    <h1 class="app-title">出欠管理システム</h1>

    <!-- 右側エリア -->
    <div class="header-right">
      <div id="login-name" class="login-name">ログイン名</div>
      <button id="logout-btn" class="logout-btn" type="button">ログアウト</button>
    </div>
  </header>

  <!-- メイン -->
  <main class="page">
    <div class="page-top">
      <h2 class="page-title">ユーザー設定変更(学生)</h2>
    </div>

    <!-- ユーザー情報表示エリア -->
    <section class="user-info-section" aria-label="ユーザー情報">
      <p class="user-info-text">学生番号：<span id="student-id"></span></p>
      <p class="user-info-text">名前：<span id="student-name"></span></p>

      <div class="course-field">
        <label for="course" class="course-label">コース</label>

        <!-- 既存base.cssの共通部品を流用 -->
        <div class="compact-select-wrap course-select-wrap">
          <select id="course" name="course" class="select-input compact-select course-select">
              <option value="">選択してください</option>
          </select>
        </div>
      </div>
    </section>

    <!-- 操作ボタン -->
    <section class="action-section">
      <button type="button" class="submit-btn" id="submit-btn">登録</button>
      <button type="button" class="delete-btn" id="delete-btn">削除</button>
    </section>

  </main>
</body>
</html>
