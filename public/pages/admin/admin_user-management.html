<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />

  <!-- スマホなどでも正しく表示するための設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- ブラウザのタブに表示されるタイトル -->
  <title>ユーザー編集</title>

  <!-- 参照CSS -->
  <link rel="stylesheet" href="../../assets/css/style.css" />

  <!-- 認証JS -->
  <script src="../../assets/js/common/auth.js" defer></script>
  <script src="../../assets/js/common/login.js" defer></script> 

  <!-- ページ固有JS -->
  <script src="../../assets/js/pages/admin-user-management.js" defer></script>
  
</head>

<body class="role-admin page-admin_user-management">

  <!-- =============================
       ヘッダー
       全ページ共通の上部バー
  ============================== -->
  <header class="app-header">

    <!-- 戻るボタン -->
    <a href="admin_dashboard.html" class="back-btn">
      <!-- SVGで矢印アイコンを描画 -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M14.5 5.5L8 12l6.5 6.5"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </a>

    <!-- システムタイトル -->
    <h1 class="app-title">出欠管理システム</h1>

    <!-- ログインユーザー情報 -->
    <div class="header-right">

      <!-- ログインしているユーザー名 -->
      <div id="login-name" class="login-name">ログイン名</div>

      <!-- ログアウトボタン -->
      <button id="logout-btn" class="logout-btn" type="button">ログアウト</button>

    </div>
  </header>



  <!-- =============================
       メインコンテンツ
  ============================== -->
  <main class="page attendance-page">


    <!-- ページタイトル -->
    <div class="page-top">
      <h2 class="page-title">ユーザー編集</h2>
    </div>

        <!-- 追加ボタン -->
        <div class="user-edit-actions">
          <a href="admin_user-add.html">
            <button class="add-user-btn" id="addUserBtn" type="button">追加</button>
          </a>
        </div>

    <!-- =============================
         絞り込み条件エリア
    ============================== -->
    <section class="content">
      <form class="user-form" action="#" method="post">
        <!-- ユーザー種別選択 -->
        <div class="row">
          <div class="label-inline">ユーザー種別:</div>
          <div id="radio-group" class="radio-group" role="radiogroup" aria-label="ユーザー種別">

            <!-- ラジオボタン -->
            <label class="radio-item">
              <input type="radio" name="userType" value="teacher" checked />
              <span>教員</span>
            </label>
            <label class="radio-item">
              <input type="radio" name="userType" value="student" />
              <span>学生</span>
            </label>

          </div>
        </div>
      </form>

    </section>

    <!-- =============================
         学生一覧テーブル
    ============================== -->
    <section class="student-list-section" aria-label="ユーザー一覧">

      <div class="user-table-layout">

        <!-- テーブル本体 -->
        <div class="user-table-wrap" id="userTableWrap">
          <table class="user-table">
            <thead>
              <tr>
                <th class="col-name">名前</th>
                <th class="col-type">ユーザー種別</th>
                <th class="col-action">操作</th>
              </tr>
            </thead>

            <tbody id="userTableBody">
              <!-- JavaScriptで描画 -->
            </tbody>
          </table>
        </div>

      </div>
    </section>
  </main>
</body>
</html>
