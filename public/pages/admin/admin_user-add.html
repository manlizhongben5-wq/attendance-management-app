<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ユーザー追加</title>

  <!-- 参照CSS -->
  <link rel="stylesheet" href="../../assets/css/style.css" />
  
  <!-- 共通JS -->
  <script src="../../assets/js/common/pass.js" defer></script>
  
  <!-- 認証JS -->
  <script src="../../assets/js/common/auth.js" defer></script>
  <script src="../../assets/js/common/login.js" defer></script> 

  <!-- ページ固有JS -->
  <script src="../../assets/js/pages/admin-user-add.js" defer></script>


</head>
<body class="role-admin page-admin-user-add">

  <!--ヘッダー -->
  <header class="app-header">

    <!-- 左の戻る矢印 -->
    <a id="backLink">
      <button class="back-btn" type="button" aria-label="戻る">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M14.5 5.5L8 12l6.5 6.5"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </a>

    <h1 class="app-title">出欠管理システム</h1>

    <!-- 右側エリア -->
    <div class="header-right">
      <div id="login-name" class="login-name">ログイン名</div>
      <button id="logout-btn" class="logout-btn" type="button">ログアウト</button>
    </div>
  </header>

  <!-- メイン -->
  <main class="page">
    <div class="page-top">
      <h2 class="page-title">ユーザー追加</h2>
    </div>

    <section class="content">
      <form class="user-form" action="#" method="post">
        <!-- ユーザー種別選択 -->
        <div class="row">
          <div class="label-inline">ユーザー種別:</div>
          <div class="radio-group" role="radiogroup" aria-label="ユーザー種別">
            <label class="radio-item">
              <input type="radio" name="userType" value="teacher" checked />
              <span>教員</span>
            </label>
            <label class="radio-item">
              <input type="radio" name="userType" value="student" />
              <span>学生</span>
            </label>
          </div>
        </div>

        <!-- 学生・教員番号入力 -->
        <div id="userId" class="field">
          <label for="number" class="field-label">
            学生・教員番号<span class="req">*</span>
          </label>
          <input id="number" name="number" type="text" class="text-input" />
        </div>

        <!-- 名前入力 -->
        <div id="userName" class="field">
          <label for="name" class="field-label">
            名前<span class="req">*</span>
          </label>
          <input id="name" name="name" type="text" class="text-input" />
        </div>

        <!-- コース選択(学生のみ) -->
        <div id="courseArea" class="field hidden">
          <label for="course" class="field-label">
            コース<span class="req">*</span>
          </label>
          <div class="select-wrap">
            <select id="course" name="course" class="select-input">
              <option value="">選択してください</option>
            </select>
          </div>
        </div>

        <div id="yearArea" class="field hidden">
          <label for="enrollmentYear" class="field-label">
            入学年度<span class="req">*</span>
          </label>

          <input
            id="enrollmentYear"
            type="text"
            maxlength="4"
            class="text-input"
          >
        </div>

        <!-- パスワード入力 -->
        <label for="password" class="field-label">
          パスワード<span class="req">*</span>
        </label>

        <div class="password-field">
          <input
            id="password"
            name="password"
            type="password"
            class="form-input"
            autocomplete="new-password"
          />
            <button
              id="toggle-password"
              type="button"
              class="eye-btn"
              aria-label="パスワードを表示"
              aria-pressed="false"
            >
              👁
            </button>
        </div>

        <div class="actions">
          <button id="registerBtn" class="submit-btn" type="button">登録</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
