<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  
  <!-- スマホなどでも正しく表示するための設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  
  <!-- ブラウザのタブに表示されるタイトル -->
  <title>教科別確認</title>

  <!-- 参照CSS -->
  <link rel="stylesheet" href="../../assets/css/style.css" />

  <!-- 認証JS -->
  <script src="../../assets/js/common/auth.js" defer></script>
  <script src="../../assets/js/common/login.js" defer></script> 
  
  <!-- ページ固有JS -->
  <script src="../../assets/js/pages/student-check-subject.js" defer></script>

</head>

<body class="role-student page-student_check-subject">

  <!-- =============================
       ヘッダー
       全ページ共通の上部バー
  ============================== -->
  <header class="app-header">
    
    <!-- 左の戻る矢印 -->
    <a href="student_dashboard.html" class="back-btn">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M14.5 5.5L8 12l6.5 6.5"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </a>

    <h1 class="app-title">出欠管理システム</h1>

    <!-- 右側エリア -->
    <div class="header-right">
      <div id="login-name" class="login-name">ログイン名</div>
      <button id="logout-btn" class="logout-btn" type="button">ログアウト</button>
    </div>
  </header>

  <!-- メイン -->
  <main class="page attendance-page">
    <div class="page-top">
      <h2 class="page-title">教科別確認-<strong id="subjectTitle">未選択</strong></h2>
    </div>

    <section class="filter-area subject-filter-area" aria-label="絞り込み条件">
      <div class="filter-row subject-filter-row">
        <div class="filter-item subject-filter-item">
          <label for="termSelect" class="filter-label">学期:</label>
          <div class="select-wrap subject-select-wrap">
            <select id="termSelect" name="termSelect" class="select-input subject-select">
              <option value="前期">前期</option>
              <option value="後期">後期</option>
            </select>
          </div>
        </div>

        <div class="filter-item subject-filter-item">
          <label for="subjectSelect" class="filter-label">科目:</label>
          <div class="select-wrap subject-wide-select-wrap">
            <select id="subjectSelect" name="subjectSelect" class="select-input subject-select">
              <option value="">科目を選択してください</option>
            </select>
          </div>
        </div>
      </div>
    </section>

    <section class="student-list-section summary-list-section" aria-label="出席状況">
      <h3 class="student-list-title">出席状況</h3>

      <div class="attendance-note">
        ※「出席」だけでカウントしているため、遅刻や早退がある場合は出席数が異なる場合があります
      </div>

      <div class="summary-table-wrap">
        <table class="summary-table">
          <thead>
            <tr>
              <th class="col-attend-now">出席コマ数</th>
              <th class="col-total-now">実施済コマ数</th>
              <th class="col-total">総コマ数</th>
              <th class="col-rate">出席率</th>
            </tr>
          </thead>
          <tbody id="studentTableBody">
            <tr>
              <td colspan="4" style="text-align:center; padding:20px;">
                科目を選択してください
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
