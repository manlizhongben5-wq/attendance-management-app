<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />

  <!-- スマホなどでも正しく表示するための設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ブラウザのタブに表示されるタイトル -->
  <title>全体出欠画面(編集)</title>

  <!-- 参照CSS -->
  <link rel="stylesheet" href="../../assets/css/style.css" />

  <!-- 認証JS -->
  <script src="../../assets/js/common/auth.js" defer></script>
  <script src="../../assets/js/common/login.js" defer></script>

  <!-- ページ固有JS -->
  <script src="../../assets/js/pages/teacher-record-attendance.js" defer></script>

</head>

<!-- 
bodyのclass
role-teacher → 教員画面
page-teacher-attendance-reference → このページ専用識別
-->
<body class="role-teacher page-teacher_record-attendance">

 <!-- =============================
       ヘッダー
       全ページ共通の上部バー
  ============================== -->
  <header class="app-header">

    <!-- 戻るボタン -->
    <a href="teacher_dashboard.html" class="back-btn">

      <!-- SVGで矢印アイコンを描画 -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M14.5 5.5L8 12l6.5 6.5"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>

    </a>

  <!-- ページ種別タイトル -->
  <div class="header-page-title">変更</div>

  <!-- システムタイトル -->
  <h1 class="app-title">出欠管理システム</h1>

  <!-- ログインユーザー情報 -->
  <div class="header-right">

    <!-- ログインしているユーザー名 -->
    <div id="login-name" class="login-name">ログイン名</div>

    <!-- ログアウトボタン -->
    <button id="logout-btn" class="logout-btn" type="button">ログアウト</button>

  </div>
</header>



  <!-- =============================
       メインコンテンツ
  ============================== -->
  <main class="page attendance-page">


    <!-- ページタイトル -->
    <div class="page-top">
      <h2 class="page-title">出欠状況入力</h2>
    </div>

    <!-- =============================
         絞り込み条件エリア
         学年 / 学科 を指定
    ============================== -->
    <section class="attendance-toolbar" aria-label="出欠入力条件">
      <div class="toolbar-row toolbar-row-top">
        
        <!-- ===== 日付選択 ===== -->
        <div class="filter-item filter-item-date">

          <!-- ラベル -->
          <label for="targetDate" class="filter-label">日付:</label>

          <!-- カレンダー入力 -->
          <div class="date-input-wrap">

            <!-- HTML標準の日付入力 -->
            <input
              id="targetDate"
              name="targetDate"
              type="date"
              class="date-input"
            />

            <!-- カレンダーアイコン -->
            <!-- CSSで右側に配置 -->
            <svg class="calendar-icon" viewBox="0 0 24 24">
              <path fill="currentColor"
              d="M7 2h2v2h6V2h2v2h3a2 2 0 0 1 2 2v14a2
              2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2
              2 0 0 1 2-2h3V2zm13 8H4v10h16V10z"/>
            </svg>

          </div>
        </div>

        <!-- ===== 学年セレクト ===== -->
        <div class="toolbar-center-group">
          <div class="filter-item filter-item-grade">

            <label for="grade" class="filter-label">学年:</label>

            <!-- セレクトボックス -->
            <div class="select-wrap small-select-wrap">

              <select id="grade" name="grade" class="select-input small-select">
                <option value="1" selected>1年</option>
                <option value="2">2年</option>
              </select>

            </div>
          </div>

          <!-- ===== 学科選択（ラジオボタン） ===== -->
          <fieldset class="filter-item filter-item-course course-group" id="courseFieldset">
            <legend class="filter-label">学科:</legend>
          
            <!-- JSで動的生成 -->
            <div id="courseOptions" class="course-options"></div>
          </fieldset>
        </div>

        <div class="inline-field toolbar-period">
          <label for="period" class="inline-label">時限:</label>
          <div class="compact-select-wrap period-select-wrap">
            <select id="period" class="select-input compact-select">
              <option selected>1限</option>
              <option>2限</option>
              <option>3限</option>
              <option>4限</option>
            </select>
          </div>
        </div>
      </div>

      <div class="toolbar-row toolbar-row-bottom">
        <div class="student-list-title">学生一覧</div>

        <div class="toolbar-actions">
          <button type="button" class="gray-btn" id="selectAllPresentBtn">全員出席</button>
          <button type="button" class="gray-btn" id="clearAllBtn">全員未選択</button>
          <button type="button" class="gray-btn" id="saveAttendanceBtn">保存</button>
        </div>

        <div class="inline-field toolbar-subject">
          <label for="subject" class="inline-label">科目:</label>
          <div class="compact-select-wrap subject-select-wrap">
            <select id="subject" class="select-input compact-select">
            </select>
          </div>
        </div>
      </div>

      <div class="summary-row" id="summaryRow">
      </div>
    </section>

    <!-- 学生一覧テーブル -->
    <section class="table-section" aria-label="学生一覧">
      <div class="student-table-wrap" id="studentTableWrap">
        <table class="student-table">
          <thead>
            <tr>
              <th class="col-number">学籍番号</th>
              <th class="col-name">氏名</th>
              <th class="col-attendance">出欠</th>
            </tr>
          </thead>

          <tbody id="attendanceTable">
            
          </tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
