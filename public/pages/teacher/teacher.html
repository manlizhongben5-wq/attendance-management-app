<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  
  <!-- スマホなどでも正しく表示するための設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  
  <!-- ブラウザのタブに表示されるタイトル -->
  <title>ログイン</title>

  <!-- 参照CSS -->
  <link rel="stylesheet" href="../../assets/css/style.css" />
  
  <!-- 共通JS -->
  <script src="../../assets/js/common/pass.js" defer></script>

  <!-- 認証JS -->
  <script src="../../assets/js/common/auth.js" defer></script>
  <script src="../../assets/js/common/login.js" defer></script>

</head>

<body class="role-teacher page-admin-dashboard">

  <header class="app-header">

    <h1 class="app-title">出欠管理システム</h1>

  </header>

    <!-- メイン -->
    <main class="page-main">
      <p class="login-guide">
        学籍番号または教員番号、パスワードを入力してください。
      </p>

      <form id="loginForm" class="login-form" action="#" method="post">
        <div class="form-row">
          <label for="user-id" class="form-label">ユーザーID</label>
          <input
            id="user-id"
            name="userId"
            type="text"
            class="form-input"
            autocomplete="username"
          />
        </div>

        <div class="form-row">
          <label for="password" class="form-label">パスワード</label>

          <div class="password-field">
            <input
              id="password"
              name="password"
              type="password"
              class="form-input"
              autocomplete="current-password"
            />
            <button
              id="toggle-password"
              type="button"
              class="eye-btn"
              aria-label="パスワードを表示"
              aria-pressed="false"
            >
              👁
            </button>
          </div>
        </div>

        <div class="btn-area">
          <button id="login-btn" type="submit" class="login-btn">ログイン</button>
        </div>
      </form>
    </main>
  </div>
</body>
</html>
