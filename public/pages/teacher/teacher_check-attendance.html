<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  
  <!-- スマホなどでも正しく表示するための設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- ブラウザのタブに表示されるタイトル -->
  <title>全体出欠状況（参照）</title>

  <!-- 参照CSS -->
  <link rel="stylesheet" href="../../assets/css/style.css" />

  <!-- 認証JS -->
  <script src="../../assets/js/common/auth.js" defer></script>
  <script src="../../assets/js/common/login.js" defer></script>
  
  <!-- ページ固有JS -->
  <script src="../../assets/js/pages/teacher-check-attendance.js" defer></script>
  
  <!-- エクスポート機能用のスクリプト -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver/dist/FileSaver.min.js"></script>

</head>

<body class="role-teacher page-teacher_check-attendance">

  <header class="app-header">
    <a href="teacher_dashboard.html" class="back-btn">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M14.5 5.5L8 12l6.5 6.5"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </a>

    <div class="header-page-title">参照</div>
    <h1 class="app-title">出欠管理システム</h1>

    <div class="header-right">
      <div id="login-name" class="login-name">ログイン名</div>
      <button id="logout-btn" class="logout-btn" type="button">ログアウト</button>
    </div>
  </header>

  <main class="page attendance-page">

    <div class="page-top">
      <h2 class="page-title">全体出欠状況</h2>
    </div>

    <section class="filter-area" aria-label="絞り込み条件">
      <div class="filter-row">

        <div class="filter-item filter-item-date">
          <label for="targetDate" class="filter-label">日付:</label>

          <div class="date-input-wrap">
            <input
              id="targetDate"
              name="targetDate"
              type="date"
              class="date-input"
            />

            <svg class="calendar-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M7 2h2v2h6V2h2v2h3a2 2 0 0 1 2 2v14a2
                2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2
                2 0 0 1 2-2h3V2zm13 8H4v10h16V10z"
              />
            </svg>
          </div>
        </div>

        <div class="filter-item filter-item-grade">
          <label for="grade" class="filter-label">学年:</label>

          <div class="select-wrap small-select-wrap">
            <select id="grade" name="grade" class="select-input small-select">
              <option value="1" selected>1年</option>
              <option value="2">2年</option>
            </select>
          </div>
        </div>

        <!-- 学科はJSで動的生成 -->
        <fieldset class="filter-item filter-item-course course-group" id="courseFieldset">
          <legend class="filter-label">学科:</legend>

          <div id="courseOptions" class="course-options">
            <span class="course-loading">読み込み中...</span>
          </div>
        </fieldset>

        <div class="filter-action">
          <button type="button" class="export-btn" id="exportBtn">エクスポート</button>
        </div>

      </div>
    </section>

    <section class="student-list-section" aria-label="学生一覧">
      <h3 class="student-list-title">学生一覧</h3>

      <div class="student-table-layout">
        <div class="student-table-wrap" id="studentTableWrap">
          <table class="student-table attendance-summary-table">

            <colgroup>
              <col class="col-student" />
              <col class="col-subject" />
              <col class="col-status" />
              <col class="col-subject" />
              <col class="col-status" />
              <col class="col-subject" />
              <col class="col-status" />
              <col class="col-subject" />
              <col class="col-status" />
            </colgroup>

            <thead>
              <tr class="period-row">
                <th class="col-student" rowspan="2">氏名</th>
                <th colspan="2">1限目</th>
                <th colspan="2">2限目</th>
                <th colspan="2">3限目</th>
                <th colspan="2">4限目</th>
              </tr>

              <tr class="sub-row">
                <th class="col-subject">教科</th>
                <th class="col-status">出欠</th>
                <th class="col-subject">教科</th>
                <th class="col-status">出欠</th>
                <th class="col-subject">教科</th>
                <th class="col-status">出欠</th>
                <th class="col-subject">教科</th>
                <th class="col-status">出欠</th>
              </tr>
            </thead>

            <tbody id="attendanceTable">
              <tr>
                <td colspan="9" style="text-align:center; padding:16px;">
                  読み込み中...
                </td>
              </tr>
            </tbody>

          </table>
        </div>
      </div>
    </section>

  </main>
</body>
</html>
